name: iOS Simulator Build

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Собираем именно для симулятора (архитектура x86_64 / arm64 для симулятора)
      - name: Build iOS Simulator App
        run: flutter build ios --simulator

      # Запаковываем .app в архив .zip (это нужно для Appetize.io)
      - name: Archive Simulator App
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner.zip Runner.app

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/Runner.zip